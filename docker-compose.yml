services:
  album-link:
    build: .
    container_name: album-link
    restart: unless-stopped
    ports:
      - "43123:3000"
    environment:
      # Container path. The host .env PHOTOS_ROOT is for local npm only.
      PHOTOS_ROOT: /app/photos
      DATA_DIR: /app/data
      CACHE_DIR: /app/cache
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      APP_URL: ${APP_URL:-http://127.0.0.1:43123}
      APP_NAME: "${APP_NAME:-album link}"
    volumes:
      # NAS albums, read-only inside the app
      - ${PHOTOS_HOST_PATH:-/volume1/photos/albums}:/app/photos:ro
      - ./data:/app/data
      - ./cache:/app/cache
